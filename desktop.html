<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nanno Desktop</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Verdana,sans-serif;
}

body{
height:100vh;
background:url("fondo.jpg") center/cover;
overflow:hidden;
}

.desktop{
width:100%;
height:100%;
position:relative;
}

.icon{
width:90px;
text-align:center;
position:absolute;
cursor:pointer;
transition:.2s;
}

.icon:hover{
transform:scale(1.1);
}

.icon img{
width:60px;
height:60px;
image-rendering:pixelated;
}

.icon span{
display:block;
margin-top:5px;
font-size:13px;
color:white;
text-shadow:1px 1px 3px black;
}

.window{
position:absolute;
top:60px;
left:120px;
width:420px;
height:520px;
background:#ffd8ec;
border:3px solid #5d73c8;
display:none;
border-radius:8px;
overflow:hidden;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.titlebar{
background:#4f6fc7;
color:white;
padding:8px;
display:flex;
justify-content:space-between;
align-items:center;
}

.close{
cursor:pointer;
background:white;
color:black;
padding:2px 8px;
border-radius:4px;
}

.chat{
padding:10px;
height:390px;
overflow:auto;
background:white;
}

.msg{
margin:10px 0;
padding:10px;
border-radius:12px;
max-width:75%;
}

.me{
background:#ffd5ea;
margin-left:auto;
}

.bot{
background:#d8e6ff;
}

.bottom{
display:flex;
padding:10px;
gap:10px;
background:#ffe7f4;
}

.bottom input{
flex:1;
padding:8px;
}

.bottom button{
padding:8px 15px;
}
</style>

</head>
<body>

<div class="desktop">

<div class="icon" style="left:40px;top:40px" onclick="abrir()">
<img src="chat.png">
<span>Chat</span>
</div>

<div class="icon" onclick="location.href='index.html'">
    <img src="blog.png">
    <span>Volver al Blog</span>
</div>

<div class="icon" style="left:40px;top:280px">
<img src="art.png">
<span>Dibujos</span>
</div>

<div class="icon" style="left:40px;top:400px">
<img src="bot.png">
<span>Bots</span>
</div>

<div class="window" id="chatWindow">

<div class="titlebar">
Mom &lt;3
<div class="close" onclick="cerrar()">X</div>
</div>

<div class="chat" id="chat">

<div class="msg bot">
Hola Jade 💙
</div>

<div class="msg bot">
Bienvenida a Nanno & Tae.
</div>

</div>

<div class="bottom">

<input id="texto" placeholder="Escribe...">

<button onclick="enviar()">
Enviar
</button>

</div>

</div>

</div>

<script>

function abrir(){
document.getElementById("chatWindow").style.display="block";
}

function cerrar(){
document.getElementById("chatWindow").style.display="none";
}

const respuestas=[
"Estoy editando código.",
"Prueba los bots.",
"Qué bonito verte por aquí.",
"Todo funciona... por ahora.",
"Los dibujos están esperando."
];

function enviar(){

let texto=document.getElementById("texto");

if(texto.value=="")return;

let chat=document.getElementById("chat");

chat.innerHTML+=`
<div class="msg me">
${texto.value}
</div>`;

let r=respuestas[Math.floor(Math.random()*respuestas.length)];

setTimeout(()=>{

chat.innerHTML+=`
<div class="msg bot">
${r}
</div>`;

chat.scrollTop=chat.scrollHeight;

},500);

texto.value="";

}

</script>

</body>
</html>

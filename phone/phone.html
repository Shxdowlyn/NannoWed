<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nanno Phone</title>

<link rel="stylesheet" href="phone.css">
</head>

<body>

<!-- Fondo oscuro -->
<div class="phone-overlay" id="overlay">

    <!-- Celular -->
    <div class="phone" id="phone">

        <!-- Barra superior -->
        <div class="status-bar">

            <span id="hora">21:44</span>

            <div class="status-icons">
                📶
                📡
                🔋100%
            </div>

        </div>

        <!-- Widget dinámico -->
        <div class="widget-area">

            <div class="widget" id="widget">
                <img src="img/widgets/start.png">
            </div>

        </div>

        <!-- Apps -->

        <div class="apps">

            <a href="chat.html" class="app">
                <img src="img/icons/chat.png">
                <span>Chat</span>
            </a>

            <a href="art.html" class="app">
                <img src="img/icons/art.png">
                <span>Dibujos</span>
            </a>

            <a href="bots.html" class="app">
                <img src="img/icons/bot.png">
                <span>Bots</span>
            </a>

            <a href="gallery.html" class="app">
                <img src="img/icons/gallery.png">
                <span>Galería</span>
            </a>

            <a href="about.html" class="app">
                <img src="img/icons/about.png">
                <span>Sobre mí</span>
            </a>

            <a href="music.html" class="app">
                <img src="img/icons/music.png">
                <span>Música</span>
            </a>

            <a href="photos.html" class="app">
                <img src="img/icons/photo.png">
                <span>Fotos</span>
            </a>

            <a href="index.html" class="app">
                <img src="img/icons/home.png">
                <span>Inicio</span>
            </a>

        </div>

        <!-- Barra inferior -->

        <div class="dock">

            <div class="search">

                ♡ Search ♡

            </div>

        </div>

    </div>

</div>

<script src="phone.js"></script>

</body>
</html>
